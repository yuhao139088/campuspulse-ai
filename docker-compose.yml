services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DEMO_AUTH_ENABLED: "false"
      DATABASE_URL: postgresql://campuspulse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/campuspulse
      S3_ENDPOINT: ${S3_ENDPOINT:?Configure a private S3-compatible object store}
      HOSTNAME: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campuspulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: campuspulse
    volumes:
      - campuspulse-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuspulse -d campuspulse"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 384m
volumes:
  campuspulse-db:
